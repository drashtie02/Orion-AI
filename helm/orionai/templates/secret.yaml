apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orionai.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orionai.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  API_KEY: {{ .Values.secrets.apiKey | quote }}
