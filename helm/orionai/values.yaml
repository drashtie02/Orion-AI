replicaCount: 3

image:
  repository: orionai
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8011"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 8011
  targetPort: 8011
  annotations: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: orionai.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: orionai-tls
      hosts:
        - orionai.example.com

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 2

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: standard
    size: 5Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
  external:
    enabled: false
    host: ""
    port: 6379

config:
  embeddingModel: "nomic-embed-text"
  embeddingApiUrl: "http://localhost:11434/api/embeddings"
  embeddingType: "api"
  llmModel: "llama2"
  llmApiUrl: "http://localhost:11434/api/generate"
  llmType: "api"
  retrievalAlpha: 0.5
  topKDefault: 5
  maxContextTokens: 2048
  device: "auto"
  chunkSize: 512
  chunkOverlap: 0.2
  indexPath: "artifacts/index"
  useMixedPrecision: true
  cpuBatchSize: 8
  gpuBatchSize: 32
  criticThreshold: 0.6
  monthlyBudgetLimit: 100.0
  evaluationWeights:
    faithfulness: 0.3
    relevance: 0.2
    hallucination: 0.3
    sourceCoverage: 0.2
  models:
    cheapModel:
      type: api
      modelName: llama2
      apiUrl: http://localhost:11434/api/generate
      costPer1kInput: 0.0001
      costPer1kOutput: 0.0001
    strongModel:
      type: api
      modelName: llama2
      apiUrl: http://localhost:11434/api/generate
      costPer1kInput: 0.001
      costPer1kOutput: 0.001
  routingConfig:
    cheapModel: cheap_model
    strongModel: strong_model
    tokenThreshold: 500
    confidenceThreshold: 0.6

env:
  logLevel: INFO
  environment: production

secrets:
  openaiApiKey: ""
  apiKey: "changeme"

probes:
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 30

networkPolicy:
  enabled: false

resourceQuota:
  enabled: false
  hard:
    requestsCpu: "20"
    requestsMemory: 40Gi
    limitsCpu: "40"
    limitsMemory: 80Gi
    persistentvolumeclaims: "10"
    pods: "50"
