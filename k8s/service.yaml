apiVersion: v1
kind: Service
metadata:
  name: orionai-service
  namespace: orionai
  labels:
    app: orionai
    component: api
spec:
  type: ClusterIP
  selector:
    app: orionai
    component: api
  ports:
  - name: http
    port: 8011
    targetPort: http
    protocol: TCP
  sessionAffinity: None
