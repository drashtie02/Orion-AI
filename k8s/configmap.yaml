apiVersion: v1
kind: ConfigMap
metadata:
  name: orionai-config
  namespace: orionai
  labels:
    app: orionai
    component: config
data:
  config.yaml: |
    embedding_model: "nomic-embed-text"
    embedding_api_url: "http://localhost:11434/api/embeddings"
    embedding_type: "api"
    llm_model: "llama2"
    llm_api_url: "http://localhost:11434/api/generate"
    llm_type: "api"
    retrieval_alpha: 0.5
    top_k_default: 5
    max_context_tokens: 2048
    device: "auto"
    chunk_size: 512
    chunk_overlap: 0.2
    index_path: "artifacts/index"
    use_mixed_precision: true
    cpu_batch_size: 8
    gpu_batch_size: 32
    evaluation_weights:
      faithfulness: 0.3
      relevance: 0.2
      hallucination: 0.3
      source_coverage: 0.2
    critic_threshold: 0.6
    models:
      cheap_model:
        type: api
        model_name: llama2
        api_url: http://localhost:11434/api/generate
        cost_per_1k_input: 0.0001
        cost_per_1k_output: 0.0001
      strong_model:
        type: api
        model_name: llama2
        api_url: http://localhost:11434/api/generate
        cost_per_1k_input: 0.001
        cost_per_1k_output: 0.001
    monthly_budget_limit: 100.0
    routing_config:
      cheap_model: cheap_model
      strong_model: strong_model
      token_threshold: 500
      confidence_threshold: 0.6
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
