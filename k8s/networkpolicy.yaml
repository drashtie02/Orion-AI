apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orionai-netpol
  namespace: orionai
  labels:
    app: orionai
spec:
  podSelector:
    matchLabels:
      app: orionai
      component: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: orionai
    ports:
    - protocol: TCP
      port: 8011
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
          component: cache
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 11434
