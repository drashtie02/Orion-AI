[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orionai"
version = "2.0.0"
description = "Production-grade Hybrid RAG system"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["agents*", "api*", "core*", "evaluation*", "llm*", "observability*", "retrieval*", "benchmarking*"]

[tool.black]
line-length = 127
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  | .git
  | .venv
  | venv
  | build
  | dist
)/
'''
